<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover → margins for notch/home bar come from env(safe-area-inset-*) (App.tsx, app.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- NyxOS icon (the purple aura) for tab, dock and home screen; generated by scripts/make-icons.mjs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="NyxOS" />
    <meta name="apple-mobile-web-app-title" content="NyxOS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Zahlen (Tokens, Ports, Zeiten) nicht als Telefonnummern verlinken. -->
    <meta name="format-detection" content="telephone=no" />
    <title>NyxOS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
