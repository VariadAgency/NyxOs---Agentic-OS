# Push a tag like `v0.1.0` (matching package.json) → the package is built, installed on fresh
# macOS and Ubuntu machines with install.sh, and only then published as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default: build and install tests run third-party code (dependencies). Only `publish` can write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          # no dependency cache for a release build: a cache written by another run must not end up in a release
      - run: pnpm install --frozen-lockfile
      # The bridge drives terminals through tmux; its tests need it just like a user's machine (install.sh installs it).
      - name: Install tmux
        run: command -v tmux || { if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi; }
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: pnpm test
      - run: pnpm package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            dist/nyxos-*.tar.gz
            dist/SHA256SUMS

  install-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Install like a new user (fresh machine, no Node from the runner)
        env:
          NYXOS_NO_BROWSER: "1"
        run: |
          export NYXOS_TARBALL="$(ls "$PWD"/dist/nyxos-*.tar.gz)"
          env -u NODE_OPTIONS PATH="/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:/usr/local/bin" bash install.sh
      - name: Server, bridge and onboarding API answer
        run: bash scripts/test/smoke-installed.sh

  publish:
    needs: install-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Release notes from CHANGELOG.md
        run: awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: notes.md
          files: |
            dist/nyxos-*.tar.gz
            dist/SHA256SUMS
